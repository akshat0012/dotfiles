#################################
#           Corners             #
#################################

corner-radius = 10

#################################
#            Blur               #
#################################

blur-method = "box"
blur-size = 20 
blur-strength = 10


#################################
#       General Settings        #
#################################

backend = "glx"
dithered-present = true;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

#################################
#       Rules                   #
#################################
rules: ({
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "_GTK_FRAME_EXTENTS@";
  blur-background = true;
  corner-radius = 0;
}, {
  match = "class_g = 'voli'";
  corner-radius = 4;
  background-blur = true;
}, {
  match = "class_g = 'Alacritty'";
  corner-radius = 6;
  shadow = true;
}, {
  match = "fullscreen";
  corner-radius = 0;
})

